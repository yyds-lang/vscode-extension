name: Release Extension

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Publish to VS Marketplace"
        required: false
        type: boolean
        default: true
      publish_openvsx:
        description: "Publish to Open VSX"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  build-and-package:
    name: Build and Package VSIX
    runs-on: ubuntu-latest
    outputs:
      vsix_name: ${{ steps.vsix_name.outputs.value }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: pnpm build

      - name: Test extension
        run: pnpm test

      - name: Package VSIX
        run: pnpm package

      - name: Resolve VSIX file name
        id: vsix_name
        shell: bash
        run: |
          VSIX="${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.vsix"
          test -f "$VSIX"
          echo "value=${VSIX}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: ${{ steps.vsix_name.outputs.value }}
          if-no-files-found: error

  publish-marketplace:
    name: Publish to VS Marketplace
    runs-on: ubuntu-latest
    needs: build-and-package
    if: ${{ github.event_name == 'push' || inputs.publish_marketplace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: .

      - name: Publish to VS Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ needs.build-and-package.outputs.vsix_name }}
          skipDuplicate: true

  publish-openvsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: build-and-package
    if: ${{ github.event_name == 'push' || inputs.publish_openvsx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: .

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ needs.build-and-package.outputs.vsix_name }}
          skipDuplicate: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: .

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.build-and-package.outputs.vsix_name }}
          generate_release_notes: true
